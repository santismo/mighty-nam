name: mighty_plug_manager
description: NAM Plug controller, adapted from Mightier Amp.
publish_to: none
version: 0.4.3+18
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nam_device:
    path: plugins/nam_device
  nam_link:
    path: packages/nam_link
  flutter_web_auth_2: 3.1.2
  file_selector: ^1.0.3
  url_launcher: ^6.3.1
dev_dependencies:
  crypto: ^3.0.6
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
